services:
  n8n:
    image: n8nio/n8n:1.78.0
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_BASE_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-Europe/London}
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - SLACK_WEBHOOK_TIER1=${SLACK_WEBHOOK_TIER1}
      - SLACK_WEBHOOK_TIER2=${SLACK_WEBHOOK_TIER2}
      - N8N_BASE_URL=${N8N_BASE_URL:-http://localhost:5678}
      - TED_API_KEY=${TED_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
